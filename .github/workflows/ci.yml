name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-tests:
    name: テスト選択
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 変更ファイルに関係するテストを選択
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA" | php .github/select-tests.php >> "$GITHUB_OUTPUT"

  tests:
    name: Pest（バックエンド）
    needs: select-tests
    if: needs.select-tests.outputs.backend != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: testing
      TEST_PATHS: ${{ needs.select-tests.outputs.backend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: PHPをセットアップ
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, pdo_sqlite, sockets
          tools: composer:v2
          coverage: none

      - name: PHP依存関係をインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: テスト環境を準備
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: 選択したテストを実行
        run: vendor/bin/pest --ci $TEST_PATHS

  pint:
    name: Pint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: PHPをセットアップ
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: sockets
          tools: composer:v2
          coverage: none

      - name: PHP依存関係をインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPのフォーマットを確認
        run: vendor/bin/pint --test

  build:
    name: ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.jsをセットアップ
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: フロントエンド依存関係をインストール
        run: npm ci

      - name: フロントエンドアセットをビルド
        run: npm run build

  browser:
    name: Pest（ブラウザ）
    needs: select-tests
    if: needs.select-tests.outputs.browser != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: testing
      TEST_PATHS: ${{ needs.select-tests.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: PHPをセットアップ
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, pdo_sqlite, sockets
          tools: composer:v2
          coverage: none

      - name: PHP依存関係をインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node.jsをセットアップ
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: フロントエンド依存関係をインストール
        run: npm ci

      - name: Chromiumとシステム依存関係をインストール
        run: npx playwright install --with-deps chromium

      - name: フロントエンドアセットをビルド
        run: npm run build

      - name: テスト環境を準備
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: 選択したブラウザテストを実行
        run: vendor/bin/pest --ci $TEST_PATHS
